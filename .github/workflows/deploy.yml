name: Build & Push (main → GHCR)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: sabia-labs/kivo

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: Sabia-Labs/kivo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-web
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-admin-api
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-admin-web
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-controller
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-agent
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-consumer
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/kivo-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kivo-api
          cache-to: type=gha,mode=max,scope=kivo-api

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/kivo-web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-web:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kivo-web
          cache-to: type=gha,mode=max,scope=kivo-web

  update-manifests:
    name: Update GitOps Manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write # needed to push commits
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PUSH_TOKEN }}
          repository: Sabia-Labs/kivo
          ref: main
          
      - name: Update Staging values with new image tag
        run: |
          # Use yq to update the image tag for all components in values-staging.yaml
          yq -i '.kivoApi.image.tag = "${{ github.sha }}"' charts/kivo/values-staging.yaml
          yq -i '.kivoWeb.image.tag = "${{ github.sha }}"' charts/kivo/values-staging.yaml
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/kivo/values-staging.yaml
          
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: deploy ${{ github.sha }} to staging [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
