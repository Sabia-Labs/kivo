name: Build & Push (main → GCP Artifact Registry)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: europe-west3-docker.pkg.dev
  PROJECT_ID: sabia-infra
  REPO_NAME: sabia-artifacts
  WIF_PROVIDER: projects/8433826157/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
  WIF_SA: github-actions-builder@sabia-infra.iam.gserviceaccount.com

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for GCP Workload Identity
      packages: write   # keeping if needed elsewhere

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-api
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-web
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/admin-api
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/admin-web
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-controller
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-agent
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-consumer
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/kivo-api
          file: apps/kivo-api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-api:${{ github.sha }},${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-api:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kivo-api
          cache-to: type=gha,mode=max,scope=kivo-api

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/kivo-web
          file: apps/kivo-web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-web:${{ github.sha }},${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-web:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kivo-web
          cache-to: type=gha,mode=max,scope=kivo-web

      - name: Build & push Admin API image
        uses: docker/build-push-action@v6
        with:
          context: apps/admin-api
          file: apps/admin-api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/admin-api:${{ github.sha }},${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/admin-api:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin-api
          cache-to: type=gha,mode=max,scope=admin-api

      - name: Build & push Admin Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/admin-web
          file: apps/admin-web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/admin-web:${{ github.sha }},${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/admin-web:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin-web
          cache-to: type=gha,mode=max,scope=admin-web

      - name: Build & push Controller image
        uses: docker/build-push-action@v6
        with:
          context: apps/controller
          file: apps/controller/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-controller:${{ github.sha }},${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-controller:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller

      - name: Build & push Agent image
        uses: docker/build-push-action@v6
        with:
          context: apps/agents
          file: apps/agents/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-agent:${{ github.sha }},${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-agent:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agents
          cache-to: type=gha,mode=max,scope=agents

      - name: Build & push Consumer image
        uses: docker/build-push-action@v6
        with:
          context: apps/consumer
          file: apps/consumer/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-consumer:${{ github.sha }},${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/kivo-consumer:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=consumer
          cache-to: type=gha,mode=max,scope=consumer

  update-manifests:
    name: Update GitOps Manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write # needed to push commits
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PUSH_TOKEN }}
          
      - name: Update staging values with new image tag
        run: |
          # Use yq to update the image tag for all components
          yq -i '.kivoApi.image.tag = "${{ github.sha }}"' charts/kivo/values-staging.yaml
          yq -i '.kivoWeb.image.tag = "${{ github.sha }}"' charts/kivo/values-staging.yaml
          yq -i '.adminApi.image.tag = "${{ github.sha }}"' charts/kivo/values-staging.yaml
          yq -i '.adminWeb.image.tag = "${{ github.sha }}"' charts/kivo/values-staging.yaml
          yq -i '.controller.image.tag = "${{ github.sha }}"' charts/kivo/values-staging.yaml
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/kivo/values-staging.yaml
          
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: deploy ${{ github.sha }} to staging [skip ci]"
            git push origin main
          else
            echo "No changes to commit"
          fi
