name: Build & Push (main → GHCR)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: sabia-labs/kivo

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GIT_PUSH_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-web
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-admin-api
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-admin-web
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-controller
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-agent
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-consumer
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/kivo-api
          file: apps/kivo-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kivo-api
          cache-to: type=gha,mode=max,scope=kivo-api

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/kivo-web
          file: apps/kivo-web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-web:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kivo-web
          cache-to: type=gha,mode=max,scope=kivo-web

      - name: Build & push Admin API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-admin-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-admin-api:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin-api
          cache-to: type=gha,mode=max,scope=admin-api

      - name: Build & push Admin Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/admin-web
          file: apps/admin-web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-admin-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-admin-web:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin-web
          cache-to: type=gha,mode=max,scope=admin-web

      - name: Build & push Controller image
        uses: docker/build-push-action@v6
        with:
          context: apps/controller
          file: apps/controller/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-controller:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-controller:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller

      - name: Build & push Agent image
        uses: docker/build-push-action@v6
        with:
          context: apps/agents
          file: apps/agents/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-agent:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-agent:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agents
          cache-to: type=gha,mode=max,scope=agents

      - name: Build & push Consumer image
        uses: docker/build-push-action@v6
        with:
          context: apps/consumer
          file: apps/consumer/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-consumer:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-consumer:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=consumer
          cache-to: type=gha,mode=max,scope=consumer

  update-manifests:
    name: Update GitOps Manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write # needed to push commits
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PUSH_TOKEN }}
          ref: main
          
      - name: Update Hetzner values with new image tag
        run: |
          # Use yq to update the image tag for all components in values-hetzner.yaml
          yq -i '.kivoApi.image.tag = "${{ github.sha }}"' charts/kivo/values-hetzner.yaml
          yq -i '.kivoWeb.image.tag = "${{ github.sha }}"' charts/kivo/values-hetzner.yaml
          yq -i '.adminApi.image.tag = "${{ github.sha }}"' charts/kivo/values-hetzner.yaml
          yq -i '.adminWeb.image.tag = "${{ github.sha }}"' charts/kivo/values-hetzner.yaml
          yq -i '.controller.image.tag = "${{ github.sha }}"' charts/kivo/values-hetzner.yaml
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/kivo/values-hetzner.yaml
          
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: deploy ${{ github.sha }} to hetzner [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
