name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Helm Lint ────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.3"

      - name: Lint chart (local values)
        run: helm lint charts/kivo -f charts/kivo/values-local.yaml

      - name: Lint chart (staging values)
        run: helm lint charts/kivo -f charts/kivo/values-staging.yaml --set kivoApi.image.tag=test --set kivoWeb.image.tag=test --set adminApi.image.tag=test --set adminWeb.image.tag=test --set controller.image.tag=test

      - name: Lint chart (prod values)
        run: helm lint charts/kivo -f charts/kivo/values-prod.yaml --set api.image.tag=test --set web.image.tag=test

      - name: Render templates (dry-run)
        run: helm template kivo charts/kivo -f charts/kivo/values-staging.yaml --set kivoApi.image.tag=test --set kivoWeb.image.tag=test --set adminApi.image.tag=test --set adminWeb.image.tag=test --set controller.image.tag=test

  # ── API Typecheck & Build ────────────────────────────────────────────────────
  api-check:
    name: API — Typecheck & Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/kivo-api/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/kivo-api
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/kivo-api
        run: pnpm typecheck



  # ── Web Typecheck & Build ────────────────────────────────────────────────────
  web-check:
    name: Web — Typecheck & Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/kivo-web/package-lock.json

      - name: Install dependencies
        working-directory: apps/kivo-web
        run: npm ci

      - name: Typecheck
        working-directory: apps/kivo-web
        run: npm run typecheck


