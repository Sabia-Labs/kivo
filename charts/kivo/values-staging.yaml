# ── Staging Environment Overrides ─────────────────────────────────────────────────
# Used by: helm upgrade --install kivo charts/kivo -f values-staging.yaml \
#            --set kivoApi.image.tag=$GIT_SHA ...

namespace: kivo-staging
kivoApi:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-api
    tag: "67e36e52cd97c55292021c5dad4ba0108624096a" # injected by CI
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi
  env:
    NODE_ENV: production
    PORT: "4000"
    CORS_ORIGIN: "https://kivo-staging.example.com"
  existingSecret: kivo-api-staging-secret
  runMigrations: true
kivoWeb:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-web
    tag: "67e36e52cd97c55292021c5dad4ba0108624096a"
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  env:
    NODE_ENV: production
    PORT: "3000"
    NEXT_PUBLIC_API_URL: "https://kivo-staging.example.com/api"
adminApi:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/admin-api
    tag: "67e36e52cd97c55292021c5dad4ba0108624096a"
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  env:
    NODE_ENV: production
    ADMIN_PORT: "4001"
    CORS_ORIGIN: "https://admin.kivo-staging.example.com"
  existingSecret: kivo-api-staging-secret
adminWeb:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/admin-web
    tag: "67e36e52cd97c55292021c5dad4ba0108624096a"
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  env:
    NODE_ENV: production
    PORT: "3001"
controller:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-controller
    tag: "67e36e52cd97c55292021c5dad4ba0108624096a"
    pullPolicy: Always
  agentImage: "europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-agent:latest"
  consumerImage: "europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-consumer:latest"
ingress:
  enabled: true
  className: nginx
  host: kivo-staging.example.com
  tls:
    enabled: true
    secretName: kivo-staging-tls
    certManager:
      enabled: true
      clusterIssuer: letsencrypt-staging
postgresql:
  embedded: false
networkPolicy:
  enabled: true
imagePullSecrets: []
