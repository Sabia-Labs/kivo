# ── Staging Environment Overrides ─────────────────────────────────────────────────
# Used by: helm upgrade --install kivo charts/kivo -f values-staging.yaml \
#            --set kivoApi.image.tag=$GIT_SHA ...

namespace: kivo-staging
adminNamespace: kivo-staging
kivoApi:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-api
    tag: "91bc4145dcc3a62d64c782f9e7f2796401352bb5" # injected by CI
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "500m"
      memory: 512Mi
  env:
    NODE_ENV: production
    PORT: "4000"
    CORS_ORIGIN: "https://app.kivo-staging.34-141-70-109.nip.io"
    RABBITMQ_MANAGEMENT_URL: "http://kivo-rabbit.infra-messaging.svc.cluster.local:15672"
    RABBITMQ_AMQP_HOST: "kivo-rabbit.infra-messaging.svc.cluster.local"
    RABBITMQ_AMQP_PORT: "5672"
    RABBITMQ_ADMIN_USER: "default_user_NNXCNkR1HkmQ1haCg-8"
    RABBITMQ_ADMIN_PASSWORD: "NMbnC7eBcarhFHXgRi2B3WMMdBWUnROI"
    ADMIN_API_INTERNAL_URL: "http://kivo-admin-api:4001"
  existingSecret: kivo-api-staging-secret
  databaseSecret: kivo-db-credentials
  runMigrations: false
kivoWeb:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-web
    tag: "91bc4145dcc3a62d64c782f9e7f2796401352bb5"
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  env:
    NODE_ENV: production
    PORT: "3000"
    NEXT_PUBLIC_API_URL: "https://app.kivo-staging.34-141-70-109.nip.io/api"
    NEXT_PUBLIC_SITE_URL: "https://www.kivo-staging.34-141-70-109.nip.io"
    API_INTERNAL_URL: "http://kivo-api:4000"
adminApi:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/admin-api
    tag: "91bc4145dcc3a62d64c782f9e7f2796401352bb5"
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  env:
    NODE_ENV: production
    ADMIN_PORT: "4001"
    CORS_ORIGIN: "https://www.kivo-staging.34-141-70-109.nip.io"
    ADMIN_WEB_URL: "https://www.kivo-staging.34-141-70-109.nip.io"
    GOOGLE_REDIRECT_URI: "https://www.kivo-staging.34-141-70-109.nip.io/admin-api/auth/google/callback"
    KIVO_API_INTERNAL_URL: "http://kivo-api:4000"
  existingSecret: kivo-api-staging-secret
  databaseSecret: kivo-admin-db-credentials
adminWeb:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/admin-web
    tag: "91bc4145dcc3a62d64c782f9e7f2796401352bb5"
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  env:
    NODE_ENV: production
    PORT: "3001"
    NEXT_PUBLIC_API_URL: "https://www.kivo-staging.34-141-70-109.nip.io/admin-api"
    NEXT_PUBLIC_KIVO_WEB_URL: "https://app.kivo-staging.34-141-70-109.nip.io"
    API_INTERNAL_URL: "http://kivo-admin-api:4001"
controller:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-controller
    tag: "91bc4145dcc3a62d64c782f9e7f2796401352bb5"
    pullPolicy: Always
  agentImage: "europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-agent:latest"
  consumerImage: "europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-consumer:latest"
ingress:
  enabled: true
  className: nginx
  host: kivo-staging.34-141-70-109.nip.io
  tls:
    enabled: true
    secretName: kivo-staging-tls
    certManager:
      enabled: true
      clusterIssuer: letsencrypt-prod
postgresql:
  embedded: false
networkPolicy:
  enabled: true
imagePullSecrets: []
rabbitmq:
  persistence:
    storageClassName: "standard-rwo"
