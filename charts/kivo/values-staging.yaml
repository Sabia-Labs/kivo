# ── Staging Environment Overrides ─────────────────────────────────────────────────
# Used by: helm upgrade --install kivo charts/kivo -f values-staging.yaml \
#            --set kivoApi.image.tag=$GIT_SHA ...

namespace: kivo-staging
adminNamespace: kivo-staging
kivoApi:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-api
    tag: "09413cb488179721203632a3862465221fd6c1b6" # injected by CI
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi
  env:
    NODE_ENV: production
    PORT: "4000"
    CORS_ORIGIN: "http://app.kivo-staging.34-141-70-109.nip.io"
  existingSecret: kivo-api-staging-secret
  runMigrations: false
kivoWeb:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-web
    tag: "09413cb488179721203632a3862465221fd6c1b6"
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  env:
    NODE_ENV: production
    PORT: "3000"
    NEXT_PUBLIC_API_URL: "http://app.kivo-staging.34-141-70-109.nip.io/api"
    NEXT_PUBLIC_SITE_URL: "http://www.kivo-staging.34-141-70-109.nip.io"
    API_INTERNAL_URL: "http://kivo-api:4000"
adminApi:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/admin-api
    tag: "09413cb488179721203632a3862465221fd6c1b6"
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  env:
    NODE_ENV: production
    ADMIN_PORT: "4001"
    CORS_ORIGIN: "http://www.kivo-staging.34-141-70-109.nip.io"
  existingSecret: kivo-api-staging-secret
adminWeb:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/admin-web
    tag: "09413cb488179721203632a3862465221fd6c1b6"
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  env:
    NODE_ENV: production
    PORT: "3001"
    NEXT_PUBLIC_API_URL: "http://www.kivo-staging.34-141-70-109.nip.io/admin-api"
    NEXT_PUBLIC_KIVO_WEB_URL: "http://app.kivo-staging.34-141-70-109.nip.io"
    API_INTERNAL_URL: "http://kivo-admin-api:4001"
controller:
  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-controller
    tag: "09413cb488179721203632a3862465221fd6c1b6"
    pullPolicy: Always
  agentImage: "europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-agent:latest"
  consumerImage: "europe-west3-docker.pkg.dev/sabia-infra/sabia-artifacts/kivo-consumer:latest"
ingress:
  enabled: true
  className: nginx
  host: kivo-staging.34-141-70-109.nip.io
  tls:
    enabled: false
    secretName: kivo-staging-tls
    certManager:
      enabled: true
      clusterIssuer: letsencrypt-staging
postgresql:
  embedded: false
networkPolicy:
  enabled: true
imagePullSecrets: []
rabbitmq:
  persistence:
    storageClassName: "standard-rwo"
