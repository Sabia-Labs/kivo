# ── Staging Overrides (k3s) ──────────────────────────────────────────────
# Used by: make up ENV=staging

namespace: kivo-staging
adminNamespace: kivo-staging
tiltDeploy: false
imagePullSecrets:
  - name: ghcr-pull-secret
kivoApi:
  replicaCount: 1
  image:
    repository: ghcr.io/sabia-labs/kivo-api
    tag: ec480f502407e643d652605a36bbe7b6b613217f
    pullPolicy: Always
  existingSecret: "kivo-api-secret"
  databaseSecret: "kivo-db-credentials"
  runMigrations: true
  env:
    CORS_ORIGIN: "https://kivo-stg.sabialabs.de,https://www.sabialabs.de,https://sabialabs.de"
    APP_URL: "https://kivo-stg.sabialabs.de"
    TELEGRAM_WEBHOOK_DOMAIN: "https://kivo-stg.sabialabs.de"
    FRONTEND_URL: "https://kivo-stg.sabialabs.de"
    LOCAL_LLM_BASE_URL: "http://ollama.kivo-staging.svc.cluster.local:11434/v1"
    OLLAMA_BASE_URL: "http://ollama.kivo-staging.svc.cluster.local:11434/v1"
kivoWeb:
  replicaCount: 1
  image:
    repository: ghcr.io/sabia-labs/kivo-web
    tag: ec480f502407e643d652605a36bbe7b6b613217f
    pullPolicy: Always
  env:
    API_INTERNAL_URL: "http://kivo-api:4000"
    NEXT_PUBLIC_API_URL: "/api"
    NEXT_PUBLIC_SITE_URL: "https://kivo-stg.sabialabs.de"
    SITE_URL: "https://kivo-stg.sabialabs.de"
networkPolicy:
  enabled: true
ingress:
  enabled: true
  className: traefik
  # Set host to the root domain for the helper templates, but we will override the rules
  host: kivo-stg.sabialabs.de
  tls:
    enabled: true
    secretName: kivo-tls
    certManager:
      enabled: true
      clusterIssuer: letsencrypt-prod
    # Explicitly list ONLY the domains that are passing validation
    hosts:
      - kivo-stg.sabialabs.de
