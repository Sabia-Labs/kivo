# ── Hetzner VPS Overrides (k3s) ──────────────────────────────────────────────
# Used by: make hetzner-deploy

namespace: kivo-staging
adminNamespace: kivo-staging
tiltDeploy: false
imagePullSecrets:
  - name: ghcr-pull-secret
kivoApi:
  replicaCount: 1
  image:
    repository: ghcr.io/sabia-labs/kivo-api
    tag: 1beb9d115b0f15de3219f8f367a02c7f31afd4d5
    pullPolicy: Always
  existingSecret: "kivo-api-secret"
  databaseSecret: "kivo-db-credentials"
  runMigrations: true
  env:
    CORS_ORIGIN: "https://kivo.sabialabs.de,https://www.sabialabs.de,https://sabialabs.de,https://auth.sabialabs.de"
    APP_URL: "https://kivo.sabialabs.de"
    TELEGRAM_WEBHOOK_DOMAIN: "https://auth.sabialabs.de"
    FRONTEND_URL: "https://auth.sabialabs.de"
kivoWeb:
  replicaCount: 1
  image:
    repository: ghcr.io/sabia-labs/kivo-web
    tag: 1beb9d115b0f15de3219f8f367a02c7f31afd4d5
    pullPolicy: Always
  env:
    API_INTERNAL_URL: "http://kivo-api:4000"
    NEXT_PUBLIC_API_URL: "/api"
    NEXT_PUBLIC_SITE_URL: "https://kivo.sabialabs.de"
    SITE_URL: "https://auth.sabialabs.de"
networkPolicy:
  enabled: true
ingress:
  enabled: true
  className: traefik
  # Set host to the root domain for the helper templates, but we will override the rules
  host: sabialabs.de
  tls:
    enabled: true
    secretName: kivo-tls
    certManager:
      enabled: true
      clusterIssuer: letsencrypt-prod
    # Explicitly list ONLY the domains that are passing validation
    hosts:
      - kivo.sabialabs.de
      - auth.sabialabs.de
