# ── Hetzner VPS Overrides (k3s) ──────────────────────────────────────────────
# Used by: make hetzner-deploy

namespace: kivo-staging
adminNamespace: kivo-staging
tiltDeploy: false
imagePullSecrets:
  - name: ghcr-pull-secret
kivoApi:
  replicaCount: 1
  image:
    repository: ghcr.io/sabia-labs/kivo-api
    tag: 8d1e96031c832bdfe19761f5acab7bb49df485a8
    pullPolicy: Always
  existingSecret: "kivo-api-secret"
  databaseSecret: "kivo-db-credentials"
  runMigrations: true
  env:
    CORS_ORIGIN: "https://kivo.sabialabs.de,https://www.sabialabs.de,https://sabialabs.de"
    APP_URL: "https://kivo.sabialabs.de"
adminApi:
  replicaCount: 1
  image:
    repository: ghcr.io/sabia-labs/kivo-admin-api
    tag: 8d1e96031c832bdfe19761f5acab7bb49df485a8
    pullPolicy: Always
  existingSecret: "kivo-api-secret"
  databaseSecret: "kivo-admin-db-credentials"
  runMigrations: true
  env:
    ADMIN_WEB_URL: "https://www.sabialabs.de"
    KIVO_WEB_URL: "https://kivo.sabialabs.de"
    GOOGLE_REDIRECT_URI: "https://www.sabialabs.de/admin-api/auth/google/callback"
kivoWeb:
  replicaCount: 1
  image:
    repository: ghcr.io/sabia-labs/kivo-web
    tag: 8d1e96031c832bdfe19761f5acab7bb49df485a8
    pullPolicy: Always
  env:
    API_INTERNAL_URL: "http://kivo-api:4000"
    NEXT_PUBLIC_API_URL: "/api"
    NEXT_PUBLIC_SITE_URL: "https://kivo.sabialabs.de"
adminWeb:
  replicaCount: 1
  image:
    repository: ghcr.io/sabia-labs/kivo-admin-web
    tag: 8d1e96031c832bdfe19761f5acab7bb49df485a8
    pullPolicy: Always
  env:
    API_INTERNAL_URL: "http://kivo-admin-api:4001"
    NEXT_PUBLIC_API_URL: "/admin-api"
    NEXT_PUBLIC_ADMIN_WEB_URL: "https://www.sabialabs.de"
    NEXT_PUBLIC_KIVO_WEB_URL: "https://kivo.sabialabs.de"
    KIVO_WEB_URL: "https://kivo.sabialabs.de"
    ADMIN_WEB_URL: "https://www.sabialabs.de"
controller:
  image:
    repository: ghcr.io/sabia-labs/kivo-controller
    tag: 8d1e96031c832bdfe19761f5acab7bb49df485a8
    pullPolicy: Always
  agentImage: "ghcr.io/sabia-labs/kivo-agent:latest"
  agentImagePullPolicy: Always
  consumerImage: "ghcr.io/sabia-labs/kivo-consumer:latest"
ingress:
  enabled: true
  className: traefik # k3s uses traefik by default
  host: sabialabs.de
  tls:
    enabled: true
    secretName: kivo-tls
    certManager:
      enabled: true
      clusterIssuer: letsencrypt-prod
postgresql:
  embedded: true
networkPolicy:
  enabled: false
rabbitmq:
  enabled: false
