apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-admin-api
  namespace: {{ .Values.namespace }}
spec:
  stripPrefix:
    prefixes:
      - /admin-api
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: {{ .Values.namespace }}
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: {{ .Values.namespace }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
