{{- /*
  RBAC for the Kivo API pod.
  (Stripped down: kivo-api no longer needs Kubernetes API access directly)
*/ -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kivo-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: kivo-api
    app.kubernetes.io/managed-by: {{ .Release.Service }}
automountServiceAccountToken: false
