{{- if .Values.kivoApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kivo-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kivo.labels" . | nindent 4 }}
    {{- include "kivo.kivoApi.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.kivoApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "kivo.kivoApi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kivo.kivoApi.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: kivo-api
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if .Values.kivoApi.runMigrations }}
      initContainers:
        - name: run-migrations
          image: "{{ .Values.kivoApi.image.repository }}:{{ .Values.kivoApi.image.tag }}"
          imagePullPolicy: {{ .Values.kivoApi.image.pullPolicy }}
          command: ["node", "dist/index.js", "--migrate-only"]
          env:
            - name: KIVO_NAMESPACE
              value: {{ .Values.namespace | quote }}
            {{- range $key, $value := .Values.kivoApi.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.postgresql.embedded }}
            - name: DATABASE_URL
              value: {{ include "kivo.postgresql.connectionString" . | quote }}
            {{- else if .Values.kivoApi.databaseSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.databaseSecret }}
                  key: DATABASE_URL
            {{- else if .Values.kivoApi.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: DATABASE_URL
            {{- end }}
            {{- if .Values.kivoApi.existingSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: INTERNAL_SERVICE_TOKEN
                  optional: true
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: RESEND_API_KEY
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: GOOGLE_REDIRECT_URI
                  optional: true
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: FRONTEND_URL
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: GEMINI_API_KEY
                  optional: true
            {{- end }}
      {{- end }}

      containers:
        - name: api
          image: "{{ .Values.kivoApi.image.repository }}:{{ .Values.kivoApi.image.tag }}"
          imagePullPolicy: {{ .Values.kivoApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.kivoApi.port }}
              protocol: TCP
          env:
            - name: KIVO_NAMESPACE
              value: {{ .Values.namespace | quote }}
            {{- range $key, $value := .Values.kivoApi.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.postgresql.embedded }}
            - name: DATABASE_URL
              value: {{ include "kivo.postgresql.connectionString" . | quote }}
            {{- else if .Values.kivoApi.databaseSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.databaseSecret }}
                  key: DATABASE_URL
            {{- else if .Values.kivoApi.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: DATABASE_URL
            {{- end }}
            {{- if .Values.kivoApi.existingSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: INTERNAL_SERVICE_TOKEN
                  optional: true
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: RESEND_API_KEY
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: GOOGLE_REDIRECT_URI
                  optional: true
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: FRONTEND_URL
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kivoApi.existingSecret }}
                  key: GEMINI_API_KEY
                  optional: true
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.kivoApi.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.kivoApi.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.kivoApi.resources | nindent 12 }}
{{- end }}
