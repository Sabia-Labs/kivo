{{- if and .Values.kivoApi.enabled .Values.networkPolicy.enabled }}
# NetworkPolicy — API
# The API pod:
#   - Accepts ingress ONLY from the web pod (within the same namespace)
#   - Egress ONLY to the postgresql pod and DNS (kube-dns)
# This makes the API unreachable from outside the cluster even if an Ingress is
# accidentally created — defence in depth on top of having no Ingress rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kivo-api-netpol
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kivo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kivo.kivoApi.selectorLabels" . | nindent 8 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kivo.kivoWeb.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kivo-agent-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kivo-agent
        - namespaceSelector:
            matchLabels:
              kivo.ai/component: workspace
      ports:
        - protocol: TCP
          port: {{ .Values.kivoApi.port }}

  egress:
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow connection to RabbitMQ
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-messaging
          podSelector:
            matchLabels:
              app.kubernetes.io/component: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 15672

    # Allow connection to Kubernetes API (for provisioning agents/namespaces)
    - ports:
        - protocol: TCP
          port: 443

    # Allow connection to Control Plane (Admin API) for configuration sync
    - to:
        - podSelector:
            matchLabels:
              {{- include "kivo.adminApi.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4001

    # Allow connection to Agent Sidecar (for direct message delivery)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kivo-agent
        - namespaceSelector:
            matchLabels:
              kivo.ai/component: workspace
      ports:
        - protocol: TCP
          port: 43124

    {{- if .Values.postgresql.embedded }}
    # Allow connection to embedded PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              {{- include "kivo.postgresql.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.port }}
    {{- else }}
    # Allow outbound to managed external database (any IP, port 5432)
    - ports:
        - protocol: TCP
          port: 5432
    {{- end }}
{{- end }}
