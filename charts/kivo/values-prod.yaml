# ── Production Environment Overrides ─────────────────────────────────────────
# Used by: helm upgrade --install kivo charts/kivo -f values-prod.yaml \
#            --set api.image.tag=$GIT_SHA --set web.image.tag=$GIT_SHA

namespace: kivo-prod
kivoApi:
  replicaCount: 1 # Single replica to save CPU
  image:
    repository: ghcr.io/sabia-labs/kivo-api
    tag: "v1.0.2" # injected by CI: --set api.image.tag=$GIT_SHA
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    NODE_ENV: production
    PORT: "4000"
    CORS_ORIGIN: "https://kivo.sabialabs.de"
  # Secret must be pre-created in the cluster by the ops team / Terraform
  existingSecret: kivo-api-prod-secret
  runMigrations: false # Run migrations as a separate, gated step in CI/CD in prod
kivoWeb:
  replicaCount: 1
  image:
    repository: ghcr.io/sabia-labs/kivo-web
    tag: "v1.0.2"
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    NODE_ENV: production
    PORT: "3000"
    NEXT_PUBLIC_API_URL: "https://api.kivo.sabialabs.de"
ingress:
  enabled: true
  className: nginx # managed by Terraform in target cluster
  host: kivo.sabialabs.de # CHANGE: update to actual production hostname
  tls:
    enabled: true
    secretName: kivo-prod-tls
    certManager:
      enabled: true
      clusterIssuer: letsencrypt-prod # production Let's Encrypt
postgresql:
  embedded: false # Use managed DB (RDS / Cloud SQL / Neon)
  # Connection string injected via kivo-api-prod-secret (DATABASE_URL key)
networkPolicy:
  enabled: true
imagePullSecrets:
  - name: ghcr-pull-secret
