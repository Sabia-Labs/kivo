apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kivo-hetzner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sabia-labs/kivo.git
    targetRevision: main
    path: charts/kivo
    helm:
      valueFiles:
        - values-hetzner.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kivo-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
